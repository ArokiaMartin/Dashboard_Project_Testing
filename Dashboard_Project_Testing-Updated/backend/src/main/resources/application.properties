spring.application.name=dashboard-backend
spring.datasource.url=jdbc:postgresql://localhost:5432/dashboard-db
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

# HikariCP connection pool tuning (override per environment as needed).
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

server.port=8081

# Comma-separated list of origins allowed to call the API (see WebCorsConfig).
# Override per environment, e.g. app.cors.allowed-origins=https://dashboard.example.com
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:4200}