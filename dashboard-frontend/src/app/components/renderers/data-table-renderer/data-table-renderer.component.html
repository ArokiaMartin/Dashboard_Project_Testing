<div class="table-empty" *ngIf="!columns.length">
  <p class="helper-text">Select one or more columns to preview the data table.</p>
</div>

<div class="table-wrapper" *ngIf="columns.length">
  <table>
    <thead>
      <tr>
        <th *ngFor="let column of columns">{{ column }}</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let row of rows">
        <td *ngFor="let column of columns">{{ row[column] }}</td>
      </tr>
    </tbody>
  </table>
</div>
