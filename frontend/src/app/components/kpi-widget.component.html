<div class="kpi-widget-container">
  <div class="card h-100 kpi-card">
    <div class="card-body">
      <div class="d-flex justify-content-between align-items-start mb-2">
        <h6 class="card-subtitle text-muted">{{ widget.title }}</h6>
        <i class="bi bi-speedometer2"></i>
      </div>

      <div *ngIf="isLoading" class="text-center py-4">
        <div class="spinner-border spinner-border-sm"></div>
      </div>

      <div *ngIf="!isLoading" class="kpi-content">
        <div class="kpi-value">
          <h2 class="mb-0">{{ formatValue(value) }}</h2>
        </div>

        <div *ngIf="percentageChange !== null" class="kpi-comparison mt-3 pt-3 border-top">
          <div class="d-flex align-items-center">
            <i
              [class]="'bi ' + getTrendIcon() + ' ' + getTrendClass()"
              style="font-size: 1.5rem; margin-right: 8px"
            ></i>
            <div>
              <p class="mb-0 fw-bold" [class]="getTrendClass()">
                {{ formatPercentageChange(percentageChange) }}
              </p>
              <small class="text-muted">
                vs
                {{ (widget.config as any).comparison?.period === 'yearago'
                  ? 'Last Year'
                  : 'Previous Period' }}
              </small>
            </div>
          </div>
          <p *ngIf="comparisonValue !== null" class="mt-2 mb-0 text-muted">
            <small>Previous: {{ formatValue(comparisonValue) }}</small>
          </p>
        </div>
      </div>
    </div>
  </div>
</div>
