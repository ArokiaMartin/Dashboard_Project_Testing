<div class="table-widget-container">
  <div class="card h-100">
    <div class="card-header">
      <h6 class="mb-0">
        <i class="bi bi-table"></i>
        {{ widget.title }}
      </h6>
    </div>
    <div class="card-body p-0 position-relative">
      <div *ngIf="isLoading" class="loading-overlay">
        <div class="spinner-border spinner-border-sm"></div>
      </div>

      <div *ngIf="displayData.length === 0" class="text-center p-4 text-muted">
        No data available
      </div>

      <div *ngIf="displayData.length > 0" class="table-responsive">
        <table class="table table-sm table-hover mb-0">
          <thead class="table-light sticky-top">
            <tr>
              <th
                *ngFor="let col of columns"
                (click)="sortBy(col)"
                class="sortable"
              >
                <div class="d-flex justify-content-between align-items-center">
                  <span>{{ col }}</span>
                  <i [class]="'bi ' + getSortIcon(col)"></i>
                </div>
              </th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let row of getPaginatedData()">
              <td *ngFor="let col of columns">{{ getCellValue(row, col) }}</td>
            </tr>
          </tbody>
        </table>
      </div>

      <!-- Pagination -->
      <div
        *ngIf="totalPages > 1"
        class="d-flex justify-content-between align-items-center p-3 border-top"
      >
        <small class="text-muted">
          Showing {{ (currentPage - 1) * pageSize + 1 }} to
          {{ Math.min(currentPage * pageSize, totalItems) }} of {{ totalItems }}
        </small>
        <nav aria-label="Page navigation">
          <ul class="pagination pagination-sm mb-0">
            <li class="page-item" [class.disabled]="currentPage === 1">
              <a class="page-link" (click)="goToPage(1)">First</a>
            </li>
            <li class="page-item" [class.disabled]="currentPage === 1">
              <a class="page-link" (click)="goToPage(currentPage - 1)">Previous</a>
            </li>
            <li
              *ngFor="let page of getPageNumbers()"
              class="page-item"
              [class.active]="page === currentPage"
            >
              <a class="page-link" (click)="goToPage(page)">{{ page }}</a>
            </li>
            <li class="page-item" [class.disabled]="currentPage === totalPages">
              <a class="page-link" (click)="goToPage(currentPage + 1)">Next</a>
            </li>
            <li class="page-item" [class.disabled]="currentPage === totalPages">
              <a class="page-link" (click)="goToPage(totalPages)">Last</a>
            </li>
          </ul>
        </nav>
      </div>
    </div>
  </div>
</div>
