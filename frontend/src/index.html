<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Dynamic Dashboard</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#1976d2" />
    <meta
      name="description"
      content="Dynamic Dashboard - Interactive Data Visualization Platform"
    />
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Outfit:wght@600;700;800;900&family=Plus+Jakarta+Sans:wght@600;700;800;900&family=Syncopate:wght@700;800&family=Syne:wght@700;800;900&family=Unbounded:wght@700;800;900&display=swap"
      rel="stylesheet"
    />
    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <!-- Bootstrap Icons -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css"
    />
    <style>
      body {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI',
          Roboto, sans-serif;
        background-color: #f8f9fa;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        text-rendering: optimizeLegibility;
        letter-spacing: -0.006em;
      }

      h1, h2, h3, h4, .brand-title {
        font-family: 'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif;
        letter-spacing: -0.02em;
      }

      .app-container {
        display: flex;
        flex-direction: column;
        min-height: 100vh;
      }

      main.main-content {
        flex: 1;
        padding: 2rem 0;
      }

      .navbar {
        box-shadow: 0 0.125rem 0.25rem rgba(0, 0, 0, 0.075);
      }

      .chart-widget-container,
      .table-widget-container,
      .kpi-widget-container {
        min-height: 300px;
      }

      .card {
        border: none;
        box-shadow: 0 0.125rem 0.25rem rgba(0, 0, 0, 0.075);
      }

      .card-header {
        border-bottom: 1px solid rgba(0, 0, 0, 0.125);
        font-weight: 500;
      }

      .drop-zone {
        border: 2px dashed #007bff;
        border-radius: 0.5rem;
        padding: 3rem;
        text-align: center;
        transition: all 0.3s ease;
        cursor: pointer;
        background-color: #f0f7ff;
      }

      .drop-zone.drag-over {
        background-color: #e7f1ff;
        border-color: #0056b3;
      }

      .file-input {
        display: none;
      }

      .chart-card {
        border: 2px solid #e0e0e0;
        border-radius: 0.5rem;
        padding: 1.5rem;
        text-align: center;
        cursor: pointer;
        transition: all 0.3s ease;
      }

      .chart-card:hover {
        border-color: #007bff;
        box-shadow: 0 0.5rem 1rem rgba(0, 123, 255, 0.15);
      }

      .chart-card.selected {
        border-color: #007bff;
        background-color: #f0f7ff;
      }

      .chart-icon {
        font-size: 2.5rem;
        color: #007bff;
      }

      .chart-card .description {
        font-size: 0.875rem;
        margin-top: 0.5rem;
        color: #6c757d;
      }

      .column-item {
        padding: 0.75rem;
        border-bottom: 1px solid #e0e0e0;
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 0.5rem;
        transition: background-color 0.2s;
      }

      .column-item:hover {
        background-color: #f8f9fa;
      }

      .column-item.selected {
        background-color: #e7f1ff;
      }

      .column-name {
        flex: 1;
        font-weight: 500;
      }

      .kpi-card {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
      }

      .kpi-card .card-body {
        padding: 2rem;
      }

      .kpi-value {
        margin: 1rem 0;
      }

      .kpi-value h2 {
        font-weight: 700;
        font-size: 2.5rem;
      }

      .kpi-comparison {
        background-color: rgba(255, 255, 255, 0.1);
        border-radius: 0.5rem;
        padding: 1rem;
      }

      .loading-overlay {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background-color: rgba(255, 255, 255, 0.8);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 10;
        border-radius: 0.375rem;
      }

      .sortable {
        cursor: pointer;
        user-select: none;
      }

      .sortable:hover {
        background-color: #f0f0f0;
      }

      @media (max-width: 768px) {
        .chart-widget-container,
        .table-widget-container,
        .kpi-widget-container {
          min-height: 250px;
        }

        .card-body {
          padding: 1rem;
        }
      }
    </style>
  </head>
  <body>
    <app-root></app-root>
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
