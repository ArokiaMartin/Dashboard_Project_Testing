spring.application.name=dashboard-backend
spring.datasource.url=jdbc:postgresql://localhost:5432/dashboard-db
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

server.port=8081

# Scheduler pool for the live-ingest flusher. The Spring default is a SINGLE thread, so one slow flush
# would stall every other scheduled task.
spring.task.scheduling.pool.size=4

# In-memory buffer of pending live events. When it is full the append endpoint answers 429 rather than
# dropping events silently (see LiveEventWriter).
app.live.queue-capacity=50000

# NOTE: a statement_timeout was deliberately NOT set here. connection-init-sql applies to every connection
# in the shared pool, so it would also cap bulk ingestion (large CREATE INDEX, wide flat-row LEFT JOINs),
# which has no retry and swallows exceptions in places — a slow upload would surface as an empty result
# rather than an error. Scope any timeout to the live flusher's own statements instead.

# Comma-separated list of origins allowed to call the API (see WebCorsConfig).
# Override per environment, e.g. app.cors.allowed-origins=https://dashboard.example.com
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:4200}